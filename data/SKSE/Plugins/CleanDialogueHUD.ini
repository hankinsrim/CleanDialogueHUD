; CleanDialogueHUD.ini - hides the mouse cursor and the compass while you talk to someone.
; Anything the plugin hid is put back when the conversation ends.


[General]

; Write CleanDialogueHUD.log (settings and every hide/show); false writes no log file.
EnableLogging=false


[Cursor]

; Hide the mouse cursor when a conversation starts (not with a gamepad, which already hides it).
HideCursor=true

; Mouse movement in one step (raw mouse units) that shows the cursor again; smaller moves count as sensor jitter.
MoveThreshold=2

; Also show the cursor on a mouse click or wheel scroll; that click or scroll does nothing else.
ShowCursorOnClick=true

; While the cursor is hidden, keep it from highlighting a dialogue line (ignores jitter, parks the pointer off screen).
BlockHiddenHover=true


[Compass]

; Hide the compass when a conversation starts.
HideCompass=true

; Show the compass again when the mouse brings the cursor back (false: hidden until the conversation ends).
ShowCompassWithCursor=false
